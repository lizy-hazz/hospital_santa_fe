<style>
  /* Estilo para las imágenes del carrusel en pantallas pequeñas */
  #carouselExampleIndicators .carousel-item img {
    height: 300px;
    object-fit: cover;
  }

  /* Media query para pantallas medianas y grandes */
  @media (min-width: 768px) {
    #carouselExampleIndicators {
      max-width: 1200px;
      margin-left: auto;
      margin-right: auto;
    } 
    #carouselExampleIndicators .carousel-item img {
      height: 500px;
      object-fit: contain;
    }
  }
  
  /* Efecto de sombra y elevación para los iconos */
  .efecto-icono {
    transition: transform 0.3s ease, filter 0.3s ease;
    display: inline-block;
    font-size: 2.5rem;
  }
  
  .efecto-icono:hover {
    transform: translateY(-15px);
    filter: drop-shadow(0 0 12px rgba(0, 255, 255, 0.9));
  }

  /* Animación para los elementos del menú */
  .nav-item {
    transition: transform 0.3s ease;
  }

  .nav-item:hover {
    transform: translateY(-3px);
  }

  .hover-pill:hover {
    background-color: #d1e3f5;
    border-radius: 50rem;
  }
  body {
  background-color: #8cb4f0; 
}
</style>
</head>
